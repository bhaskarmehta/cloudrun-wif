name: Build, Push to Artifact Registry, and Deploy to Cloud Run

on:
  push:
    branches:
      - main
      - master

# Required permissions for Workload Identity Federation OIDC token exchange
permissions:
  id-token: write
  contents: read

env:
  GCP_PROJECT_ID: 'bhaskar-mehta'
  GCP_REGION: 'us-central1'
  ARTIFACT_REPOSITORY: 'test'
  IMAGE_NAME: 'hello-python'
  SERVICE_NAME: 'python-hello-service'
  
  # WIF Provider String (Project Number: 33069396351)
  WIF_PROVIDER: 'projects/33069396351/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
  
  # Service Account
  SERVICE_ACCOUNT: 'github-action-sa@bhaskar-mehta.iam.gserviceaccount.com'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to GCP using Workload Identity Federation
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.SERVICE_ACCOUNT }}

      # 3. Set up Google Cloud SDK
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      # 4. Authenticate Docker with Artifact Registry
      - name: Configure Docker for GCP Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # 5. Build and Push Docker Image with Guaranteed Unique Tags
      - name: Build and Push Docker Image
        env:
          # Creates a unique tag like: hello-python:a1b2c3d-42-1
          TAG_UNIQUE: "${{ github.sha }}-${{ github.run_number }}-${{ github.run_attempt }}"
        run: |
          IMAGE_BASE="${{ env.GCP_REGION }}-docker.pkg.dev/${{ env.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REPOSITORY }}/${{ env.IMAGE_NAME }}"
          
          # Build container image with both unique tag and latest tag
          docker build \
            -t "${IMAGE_BASE}:${TAG_UNIQUE}" \
            -t "${IMAGE_BASE}:latest" .
          
          # Push both tags to Artifact Registry
          docker push "${IMAGE_BASE}:${TAG_UNIQUE}"
          docker push "${IMAGE_BASE}:latest"

          # Export the unique image URI for the deploy step
          echo "DEPLOY_IMAGE=${IMAGE_BASE}:${TAG_UNIQUE}" >> $GITHUB_ENV
